[project]
name = "margin"
version = "0.1.0"
description = "Ask your company's documents anything and get answers with exact citations."
requires-python = ">=3.12"
dependencies = [
  "anthropic==1.15.0",
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.4",
  "pgvector==0.5.1",
  "psycopg[binary]==3.3.6",
  "pypdf==6.21.2",
  "rank-bm25==0.2.2",
  "numpy==2.5.4",
  "httpx==0.28.1",
  "pydantic-settings==2.16.0",
  "python-multipart==0.0.32",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pyyaml==6.0.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["margin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
