# docker compose up --build   then open http://localhost:8000 and sign in as "reader".
# Needs a .env next to this file with at least DB_PASSWORD and MARGIN_PASSWORD (see .env.example).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: margin
      POSTGRES_DB: margin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U margin"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://margin:${DB_PASSWORD}@db:5432/margin
      MARGIN_PASSWORD: ${MARGIN_PASSWORD:?Set MARGIN_PASSWORD in .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}

volumes:
  pgdata:
